name: Pylint

on: [push]

jobs:
  build:
    # 24.04 for girepository-2.0, which recent PyGObject releases need
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Installing pylint dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint
    - name: Installing system dependencies
      run: >-
        sudo apt-get update &&
        sudo apt-get install -y libgirepository-2.0-dev libcairo2-dev
        pkg-config libgtk-4-dev
    - name: Installing python dependencies
      run: python -m pip install -e ".[gui,test]"
    - name: Analysing the code with pylint
      run: |
        pylint $(git ls-files '*.py')
