name: Compile Executable

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version of Release to upload to"
        required: true
        type: string
  
permissions:
  contents: write
  
jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        spec-file: [nott-your-timetable.spec, nott-your-timetable-folder.spec]
        include:
          - spec-file: nott-your-timetable.spec
            extension: .exe
          - spec-file: nott-your-timetable-folder.spec
            extension: .zip
        
    runs-on: windows-latest

    env:
      version: ${{ inputs.version || github.event.release.tag_name }}

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Installing msys2
        uses: msys2/setup-msys2@v2
        with: 
          update: true
          msystem: mingw64
          install: >-
            zip
            mingw-w64-x86_64-gtk4
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-gobject

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.version }}

      # MSYS2's Python is externally managed, so install into a venv that
      # still sees its PyGObject
      - name: Installing nott-your-timetable and pyinstaller
        run: |
          python -m venv --system-site-packages .venv
          .venv/bin/python -m pip install -e . pyinstaller

      - name: Checking GTK is available
        run: >-
          .venv/bin/python -c "import gi; gi.require_version('Gtk', '4.0');
          from gi.repository import Gtk; print('Gtk', Gtk.get_major_version(),
          Gtk.get_minor_version())"

      - name: Compiling Executable
        run: .venv/bin/python -m PyInstaller ${{ matrix.spec-file }}

      - name: Zipping Folder
        if: (matrix.spec-file == 'nott-your-timetable-folder.spec')
        run: |
          cd dist/
          zip -r nott-your-timetable.zip nott-your-timetable
          
      - name: Uploading Executable
        run: gh release upload --clobber ${{ env.version }} dist/nott-your-timetable${{ matrix.extension }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
  
  macos:
    runs-on: macos-latest
    
    strategy:
      fail-fast: false
      matrix:
        spec-file: [nott-your-timetable.spec, nott-your-timetable-folder.spec]
        include:
          - spec-file: nott-your-timetable-folder.spec
            name: -folder
    
    env:
      version: ${{ inputs.version || github.event.release.tag_name }}
    
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.version }}

      - name: Installing System Dependencies
        run: brew install pygobject3 gtk4

      # PyGObject is only installed for Homebrew's Python, so build with that
      # Python in a venv that can still see it
      - name: Installing nott-your-timetable and pyinstaller
        run: |
          PYTHON_FORMULA=$(brew deps pygobject3 | grep -m1 '^python@')
          "$(brew --prefix "$PYTHON_FORMULA")/bin/python3" -m venv \
            --system-site-packages .venv
          .venv/bin/python -m pip install -e . pyinstaller

      - name: Checking GTK is available
        run: >-
          .venv/bin/python -c "import gi; gi.require_version('Gtk', '4.0');
          from gi.repository import Gtk; print('Gtk', Gtk.get_major_version(),
          Gtk.get_minor_version())"

      - name: Compiling Executable
        run: .venv/bin/python -m PyInstaller ${{ matrix.spec-file }}
        
      # - name: Setup Node
      #  uses: actions/setup-node@v3
      #  with:
      #    node-version: latest
          
      # - name: Installing create-dmg
      #  run: npm install --global create-dmg
        
      - name: Zipping App Bundles
        run: |
          cd dist/
          zip -r nott-your-timetable-macos${{ matrix.name }}.zip nott-your-timetable.app
        
      # - name: Making dmg
        # https://stackoverflow.com/questions/286419/how-to-build-a-dmg-mac-os-x-file-on-a-non-mac-platform
        # https://stackoverflow.com/questions/96882/how-do-i-create-a-nice-looking-dmg-for-mac-os-x-using-command-line-tools
        # Code Signing
        # https://developer.apple.com/library/archive/documentation/Security/Conceptual/CodeSigningGuide/Procedures/Procedures.html
        # https://github.com/pyinstaller/pyinstaller/wiki/Recipe-OSX-Code-Signing
        # https://developer.apple.com/library/archive/technotes/tn2206/_index.html
        # https://stackoverflow.com/questions/66693435/step-by-step-recipe-for-signing-mac-installers-dmg
      #  run: |
      #    cd dist/
      #    create-dmg 'nott-your-timetable.app' --dmg-title='nott-your-timetable-${{ matrix.name }}' --identity='io.github.nott-your-timetable'
          
      - name: Uploading Executable
        run: gh release upload --clobber ${{ env.version }} dist/nott-your-timetable-macos${{ matrix.name }}.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
