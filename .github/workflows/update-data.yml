name: Update Program Data

# Regenerates dept.json/program.json from the timetable server's filter.js
# and opens a pull request when they change.
on:
  schedule:
    # Weekly, Monday 02:00 UTC (10:00 MYT)
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installing nott-your-timetable
        run: python -m pip install -e ".[test]"

      - name: Fetching latest program data
        run: >-
          python -m nott_your_timetable.utils.update_data
          --output-dir src/nott_your_timetable/data

      - name: Running tests against new data
        run: python -m pytest

      - name: Summarising changes
        id: summary
        run: |
          {
            echo "stat<<EOF"
            git diff --stat -- src/nott_your_timetable/data
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Opening pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automated/update-program-data
          delete-branch: true
          add-paths: src/nott_your_timetable/data/*.json
          commit-message: Update program data from timetable server
          title: Update program data from timetable server
          body: |
            Automated refresh of `dept.json` and `program.json` from
            `http://timetablingunmc.nottingham.ac.uk:8006/js/filter.js`.

            ```
            ${{ steps.summary.outputs.stat }}
            ```

            Tests passed against the new data. Merge and cut a release so
            users get programs that the timetable server currently accepts.
