[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nott-your-timetable"
description = "Exports Timetable for University of Nottingham Malaysia Student."
readme = "README.md"
license = { text = "GPL-3.0 license" }
requires-python = ">=3.10"
dependencies = [
    "requests",
    "icalendar>=6.1",
    # IANA timezone database for zoneinfo on platforms without one (Windows)
    "tzdata"
]
dynamic = ["version"]
authors = [
    { name = "ecyht2", email = "ecyht2@nottingham.edu.my" }
]
maintainers = [
    { name = "Zhi Yuan Wong" }
]

[project.scripts]
"nott-your-timetable-cli" = "nott_your_timetable.nott_your_timetable:main_cli"

[project.optional-dependencies]
gui = ["PyGObject"]
test = ["pytest"]

[project.gui-scripts]
"nott-your-timetable" = "nott_your_timetable.nott_your_timetable:main"

[project.urls]
"Homepage" = "https://github.com/wong80/nott-your-timetable"
"Original Project" = "https://github.com/ecyht2/nott-your-timetable"

[tool.setuptools.dynamic]
version = { attr = "nott_your_timetable.__version__" }

[tool.setuptools.package-data]
"nott_your_timetable.data" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
